<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">

</head>

<body>
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="{{ url_for('static', filename='/imagenes/logoSC.png')}}" alt="Logo" width="30" height="24"
          class="d-inline-block align-text-top">
        Smile Cloud
      </a>
    </div>
  </nav>
  <div class="login-container">

    <h1 class="login-title">Smile Cloud</h1>

    <p class="login-subtitle">
      Sistema de Gestión Odontológica
    </p>
    <h1>BIENVENIDO!</h1>
    <H2>Clinica Dental</H2>
    {% if error %}
    <div class="alert alert-danger">
      {{ error }}
    </div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Nombre Usuario</label>
        <input type="email" class="form-control" name="correo" required>

      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <center><div class="mb-3 form-check">
        <center><input type="checkbox" class="form-check-input" id="exampleCheck1"></center>
        <center><label class="form-check-label" for="exampleCheck1">Verificar</label></center>
        

      </div>
       <center><button type="submit" class="btn btn-primary">
        Ingresar
      </button></center>

      <center><a href="/RecupContra">Recuperar Contraseña</a></center>

    </form>
  </div>
</body>

</html>
