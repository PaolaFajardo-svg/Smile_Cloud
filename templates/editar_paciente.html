<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Paciente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Editar Paciente
    </h2>

   <form action="/actualizar/{{ paciente.id_paciente }}" method="POST">

    <div class="mb-3">
        <label>Tipo de documento</label>
        <select name="tipo_documento" class="form-select" required>
            <option value="CC" {% if paciente.tipo_documento == 'CC' %}selected{% endif %}>
                Cédula de ciudadanía
            </option>
            <option value="TI" {% if paciente.tipo_documento == 'TI' %}selected{% endif %}>
                Tarjeta de identidad
            </option>
            <option value="CE" {% if paciente.tipo_documento == 'CE' %}selected{% endif %}>
                Cédula de extranjería
            </option>
            <option value="PAS" {% if paciente.tipo_documento == 'PAS' %}selected{% endif %}>
                Pasaporte
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Número de documento</label>
        <input type="text"
               name="numero_documento"
               class="form-control"
               value="{{ paciente.numero_documento }}"
               required>
    </div>

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text"
               name="nombre"
               class="form-control"
               value="{{ paciente.nombre }}"
               required>
    </div>

    <div class="mb-3">
        <label>Apellido</label>
        <input type="text"
               name="apellido"
               class="form-control"
               value="{{ paciente.apellido }}"
               required>
    </div>

    <div class="mb-3">
        <label>Fecha de nacimiento</label>
        <input type="date"
               name="fecha_nacimiento"
               class="form-control"
               value="{{ paciente.fecha_nacimiento }}">
    </div>

    <div class="mb-3">
        <label>Sexo</label>
        <select name="sexo" class="form-select">
            <option value="Femenino" {% if paciente.sexo == 'Femenino' %}selected{% endif %}>
                Femenino
            </option>
            <option value="Masculino" {% if paciente.sexo == 'Masculino' %}selected{% endif %}>
                Masculino
            </option>
            <option value="Otro" {% if paciente.sexo == 'Otro' %}selected{% endif %}>
                Otro
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Teléfono</label>
        <input type="text"
               name="telefono"
               class="form-control"
               value="{{ paciente.telefono }}">
    </div>

    <div class="mb-3">
        <label>Correo</label>
        <input type="email"
               name="correo"
               class="form-control"
               value="{{ paciente.correo }}">
    </div>

    <div class="mb-3">
        <label>Dirección</label>
        <input type="text"
               name="direccion"
               class="form-control"
               value="{{ paciente.direccion }}">
    </div>

    <div class="mb-3">
        <label>EPS</label>
        <input type="text"
               name="eps"
               class="form-control"
               value="{{ paciente.eps }}">
    </div>

    <button type="submit" class="btn btn-success">
        Guardar Cambios
    </button>

    <a href="/pacientes" class="btn btn-secondary">
        Cancelar
    </a>

</form>

</div>

</body>
</html>
